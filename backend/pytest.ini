[pytest]
testpaths = tests
asyncio_mode = auto
# Fixture and test loop scopes MUST match. asyncpg connections are bound to
# the loop that created them; a session-scoped fixture loop plus a
# function-scoped test loop builds the engine on one loop and closes it on
# another, which on Windows surfaces as
# "'NoneType' object has no attribute 'send'" during teardown.
# The engine is function-scoped (see conftest), so function is correct here.
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:passlib.*
